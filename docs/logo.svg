<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Prospecto Patronum</title>
  <desc id="desc">Une baguette magique illumine un repère de carte pour révéler de nouveaux prospects.</desc>
  <defs>
    <linearGradient id="background" x1="6" y1="4" x2="58" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#312e81"/>
      <stop offset="1" stop-color="#701a75"/>
    </linearGradient>
    <linearGradient id="pin" x1="27" y1="12" x2="49" y2="41" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e0f2fe"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <radialGradient id="light">
      <stop stop-color="#e0f2fe" stop-opacity=".65"/>
      <stop offset="1" stop-color="#c4b5fd" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="18" fill="url(#background)"/>
  <rect x=".5" y=".5" width="63" height="63" rx="17.5" stroke="#fff" stroke-opacity=".12"/>
  <circle cx="34" cy="28" r="23" fill="url(#light)"/>
  <!-- Le repère géographique est révélé par la lumière de la baguette. -->
  <path d="M39 12a11 11 0 0 0-11 11c0 8 11 17 11 17s11-9 11-17a11 11 0 0 0-11-11Z" stroke="url(#pin)" stroke-width="2.5" stroke-linejoin="round"/>
  <circle cx="39" cy="23" r="3.5" fill="#e0f2fe"/>
  <!-- Une silhouette effilée garde la baguette lisible en petite taille. -->
  <path d="m13 49 5 3 17-24-2-2Z" fill="#fef3c7"/>
  <path d="m13 49 5 3 5-7-4-3Z" fill="#c4b5fd"/>
  <path d="m34 18 2.4 7.6L44 28l-7.6 2.4L34 38l-2.4-7.6L24 28l7.6-2.4Z" fill="#fff"/>
  <path d="m17 15 1.2 3.8L22 20l-3.8 1.2L17 25l-1.2-3.8L12 20l3.8-1.2Z" fill="#ddd6fe"/>
  <path d="m49 41 1 3 3 1-3 1-1 3-1-3-3-1 3-1Z" fill="#e0f2fe"/>
  <circle cx="49" cy="10" r="1.3" fill="#fef3c7"/>
</svg>
